<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tech Newspaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- Left menu on desktop, top tab bar on phones -->
    <nav class="menu" aria-label="Stories">
      <div class="brand">My Tech Newspaper<small id="brandDate"></small></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="unread" aria-selected="true">
          Unread <span class="count" id="countUnread">0</span>
        </button>
        <button class="tab" role="tab" data-view="read" aria-selected="false">
          Read <span class="count" id="countRead">0</span>
        </button>
      </div>
      <button class="reset" id="resetBtn" title="Testing only">Reset read status</button>
    </nav>

    <main>
      <header class="topbar">
        <div class="edition">
          <b id="edTitle">Loading…</b>
          <span id="edMeta"></span>
        </div>
        <div class="persona" role="group" aria-label="Why it matters for">
          <span>Why it matters for</span>
          <button data-p="exec">CEO</button>
          <button data-p="marketing">Marketing</button>
          <button data-p="product">Product</button>
          <button data-p="tech">Tech</button>
        </div>
      </header>

      <div id="notice" class="notice" hidden></div>
      <div id="feed" class="feed"></div>
    </main>
  </div>

  <!-- Order matters: read-store.js must load before app.js uses it -->
  <script src="read-store.js"></script>
  <script src="app.js"></script>
</body>
</html>
