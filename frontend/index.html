<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tech Newspaper</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .ok { color: #0f7b6c; } .err { color: #b3261e; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <h1>My Tech Newspaper</h1>
  <p id="status">Loading edition…</p>
  <ul id="list"></ul>

  <script>
    // Step 1 check: can the page load the edition file over http://localhost?
    // The path goes up one folder because the server runs from the project root.
    fetch("../data/editions/latest.json")
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(edition => {
        const status = document.getElementById("status");
        status.className = "ok";
        status.textContent = `It works: edition ${edition.date} with ${edition.stories.length} stories (prompt ${edition.prompt_version}).`;
        document.getElementById("list").innerHTML =
          edition.stories.map(s => `<li><b>${s.company}</b>: ${s.headline}</li>`).join("");
      })
      .catch(err => {
        const status = document.getElementById("status");
        status.className = "err";
        status.textContent = "Could not load the edition: " + err.message +
          ". Did you open this through the local server (http://localhost), not by double-clicking the file?";
      });
  </script>
</body>
</html>
